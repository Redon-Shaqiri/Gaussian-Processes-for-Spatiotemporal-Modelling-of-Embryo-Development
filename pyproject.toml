[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpembryos"
version = "0.0.1"
description = "Gaussian process methods for embryo data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "isort",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.setuptools.packages.find]
include = ["gpembryos*"]
exclude = ["experiments*", "tests*", "data*", "artifacts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
